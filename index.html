<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#2563eb">

    <title>Princess Palae 🤍</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="app">

        <header class="topbar">

            <div class="logo">
                Princess Palae 🤍
            </div>

            <div class="streak">
                🔥 <span id="streak">0</span>
            </div>

        </header>


        <main>


            <!-- HOME -->

            <section id="homePage" class="page active">

                <div class="greeting">
                    Your daily Chinese practice
                </div>


                <h1 class="hero-title">
                    One day.<br>
                    <span>One step closer.</span>
                </h1>


                <div class="quote-card">

                    <div class="quote-label">
                        TODAY'S REMINDER
                    </div>

                    <div id="quoteText" class="quote-text">
                    </div>

                </div>


                <div class="lesson-card">

                    <div class="lesson-header">

                        <div>

                            <div class="eyebrow">
                                TODAY'S LESSON
                            </div>

                            <h2 id="levelTitle">
                                Level 1
                            </h2>

                            <p id="levelDescription">
                                Say it and listen
                            </p>

                        </div>


                        <div class="flag">
                            🇨🇳
                        </div>

                    </div>


                    <div class="level-switch">

                        <button id="level1Btn" class="level-btn active" onclick="setLevel(1)">
                            Level 1
                        </button>


                        <button id="level2Btn" class="level-btn" onclick="setLevel(2)">
                            Level 2
                        </button>

                    </div>


                    <div class="progress">

                        <div id="progressBar" class="progress-bar">
                        </div>

                    </div>


                    <button class="primary-btn" onclick="startPractice()">
                        Start Practice
                    </button>


                    <button class="secondary-btn" onclick="showPage('wordsPage')">
                        Manage Words
                    </button>

                </div>


                <div class="stats">

                    <div class="stat">
                        <strong id="totalWords">0</strong>
                        <span>Words</span>
                    </div>


                    <div class="stat">
                        <strong id="masteredWords">0</strong>
                        <span>Mastered</span>
                    </div>


                    <div class="stat">
                        <strong id="weakWords">0</strong>
                        <span>Review</span>
                    </div>

                </div>

            </section>



            <!-- QUIZ -->

            <section id="quizPage" class="page">

                <div class="quiz-header">

                    <span id="quizMode">
                        Level 1
                    </span>


                    <span>

                        <span id="questionNumber">
                            1
                        </span>

                        /

                        <span id="questionTotal">
                            10
                        </span>

                    </span>

                </div>


                <div class="progress quiz-progress">

                    <div id="quizProgress" class="progress-bar">
                    </div>

                </div>


                <div class="question-card">

                    <div id="modeLabel" class="mode-label">
                    </div>


                    <div id="question" class="question">
                    </div>


                    <button id="questionPlayButton" class="play-btn hidden" onclick="playCurrentAudio()">
                        🔊
                    </button>


                    <button id="showAnswerBtn" class="show-answer" onclick="showAnswer()">
                        Show Answer
                    </button>


                    <div id="answer" class="answer">

                        <div id="answerChinese" class="answer-chinese">
                        </div>


                        <div id="answerPinyin" class="answer-pinyin">
                        </div>


                        <div id="answerMeaning" class="answer-meaning">
                        </div>


                        <button id="replayButton" class="secondary-btn" onclick="playCurrentAudio()">
                            🔊 Hear pronunciation
                        </button>

                    </div>


                    <div id="rating" class="rating">

                        <button class="wrong" onclick="rateAnswer(false)">
                            ❌ Didn't remember
                        </button>


                        <button class="correct" onclick="rateAnswer(true)">
                            ✅ Remembered
                        </button>

                    </div>

                </div>

            </section>



            <!-- COMPLETE -->

            <section id="completePage" class="page">

                <div class="complete">

                    <div class="complete-icon">
                        🎉
                    </div>


                    <h1>
                        Session Complete
                    </h1>


                    <p id="finalMessage"></p>


                    <div class="big-score">

                        <span id="finalScore">
                            0
                        </span>

                        /

                        <span id="finalTotal">
                            10
                        </span>

                    </div>


                    <button class="primary-btn" onclick="showPage('homePage')">
                        Back Home
                    </button>


                    <button class="secondary-btn" onclick="startPractice()">
                        Practice Again
                    </button>

                </div>

            </section>



            <!-- WORDS -->

            <section id="wordsPage" class="page">

                <h1 class="section-title">
                    My Words
                </h1>


                <p class="section-subtitle">
                    Add and manage your vocabulary.
                </p>


                <div class="form-card">

                    <label>
                        Chinese
                    </label>


                    <input id="inputChinese" placeholder="Chinese word">


                    <label>
                        Pinyin
                    </label>


                    <input id="inputPinyin" placeholder="Pinyin">


                    <label>
                        Myanmar meaning
                    </label>


                    <textarea id="inputMeaning" placeholder="Meaning"></textarea>


                    <button class="primary-btn" onclick="addWord()">
                        + Add Word
                    </button>

                </div>


                <div id="wordList" class="word-list">
                </div>


                <button class="reset-btn" onclick="resetData()">
                    Reset Data
                </button>

            </section>

        </main>



        <nav class="bottom-nav">

            <button id="navHome" class="nav-btn active" onclick="showPage('homePage')">
                🏠
                <span>Home</span>
            </button>


            <button id="navPractice" class="nav-btn" onclick="startPractice()">
                🧠
                <span>Practice</span>
            </button>


            <button id="navWords" class="nav-btn" onclick="showPage('wordsPage')">
                📚
                <span>Words</span>
            </button>

        </nav>


        <footer class="footer">
            Made with 🤍 by Arkar
        </footer>

    </div>


    <script src="data.js"></script>
    <script src="app.js"></script>

</body>

</html>
